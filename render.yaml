services:
  - type: web
    name: bamora-api
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: off
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @bamora/api build
    startCommand: pnpm --filter @bamora/api start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: UPLOAD_STORAGE
        value: disabled
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
